<!DOCTYPE html>
<html lang="zh-CN"><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>教育Plus｜一期彩色交互原型</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4f0;color:#183e34;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.layout{max-width:1150px;margin:auto;display:grid;grid-template-columns:270px 1fr;gap:70px;padding:36px 28px}aside{position:sticky;top:36px;align-self:start}h1{font-size:27px;line-height:1.35;margin:14px 0}p{color:#6c857d;line-height:1.8}label{font-size:11px;letter-spacing:2px;color:#087f73}#links{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:22px 0}#links button{border:1px solid #d4e4dc;background:#fff;padding:11px 9px;border-radius:9px;text-align:left;color:#526e64;cursor:pointer}#links button.active{background:#087f73;color:#fff;border-color:#087f73}.phone{position:relative;width:414px;height:896px;min-height:896px;aspect-ratio:414/896;border:9px solid #17382f;border-radius:34px;background:#fff;overflow:hidden;box-shadow:0 30px 70px #1d564323}.phone iframe{border:0;width:100%;height:100%;display:none;background:#f3f8f5}.phone iframe.active{display:block}.tip{font-size:12px;border-top:1px solid #cbded3;padding-top:18px}a{color:#087f73}.reset{border:0;background:none;color:#087f73;padding:0;cursor:pointer}.is-mobile body{background:#fff}.is-mobile .layout{display:block;max-width:none;margin:0;padding:0}.is-mobile .phone{width:100vw;height:100dvh;min-height:0;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}.is-mobile aside{display:none}</style><script>(function(){var ua=navigator.userAgent||"";var mobile=!!(navigator.userAgentData&&navigator.userAgentData.mobile)||/(iPhone|iPod|Android.*Mobile|Windows Phone|IEMobile|HarmonyOS.*Mobile|Mobile Safari)/i.test(ua);if(mobile)document.documentElement.classList.add("is-mobile")})();</script><div class="layout"><aside><label>EDUCATION PLUS / PHASE 01</label><h1>教育Plus<br/>一期交互原型</h1><p>清新校园青绿<br/>八大板块 · 65个页面</p><div id="links"></div><details><summary>全部二级页面（53）</summary><div id="secondary-links"></div></details><p class="tip">点击手机中的按钮体验流程。<br/>所有人物、活动、价格均为演示示例。表单不会提交到业务系统，支付、视频、下载和外部服务为模拟。</p><button class="reset" onclick="localStorage.removeItem('ep-reading-v3');localStorage.removeItem('ep-quiz-v3');location.href=location.pathname;location.reload()">重置本次演示</button></aside><main class="phone" id="phone"></main></div><script>
const names=["首页","读书会","少年派","小记者","致青春","公益课","科学港","填志愿","订报刊","我的","服务","活动"];
const secondary={"C01": "公益课程详情", "C02": "直播课堂", "C03": "回放学习", "G01": "搜索结果", "G02": "消息列表与通知详情", "G03": "我的收藏", "G04": "我的活动报名记录", "G05": "我的投稿列表", "G06": "个人资料", "G07": "教育资讯详情", "G08": "评论列表与发布", "J01": "小记者作品详情", "J02": "小记者在线投稿", "J03": "小记者投稿进度", "J04": "小记者作品档案", "J05": "小记者风采", "J06": "小记者荣誉证书", "K01": "家乡科学宝藏详情", "K02": "寻宝家作品提交", "K03": "科学追问官提问", "K04": "我的科学港记录", "K05": "科学家答案详情", "N01": "贵州教育报订阅订单确认", "N02": "支付与凭证结果", "N03": "订单详情与派送说明", "N04": "电子发票申请", "N05": "发票记录与详情", "R01": "领读员培训列表", "R02": "培训课程详情", "R03": "名家谈阅读列表", "R04": "名家讲座详情", "R05": "读后感精选", "R06": "读后感详情", "R07": "共读书库", "R08": "书目详情", "R09": "阅读打卡", "R10": "阅读积分", "R11": "阅读排行", "R12": "全省校园读书会", "R13": "学校读书会主页", "S01": "少年派作品详情", "S02": "少年派投稿表单", "S03": "赛事详情", "S04": "投稿进度", "S05": "名师指导详情", "S06": "成长作品档案", "V01": "第三方升学服务目录", "V02": "外部服务接入说明", "Y01": "我的大学动态详情", "Y02": "多彩社团详情", "Y03": "主题活动详情", "Y04": "大学生创作发布", "Y05": "我的发布"};
const prototypeVersion='20260918-unified-bottom-nav';
function go(id,push=false){id=String(id);if(!secondary[id]&&!(Number(id)>=1&&Number(id)<=12))id='1';let f=document.getElementById('f'+id);if(!f){f=document.createElement('iframe');f.id='f'+id;f.title=secondary[id]||names[Number(id)-1];f.src=(secondary[id]?'stitch/'+id+'.html':id.padStart(2,'0')+'.html')+'?v='+prototypeVersion;document.getElementById('phone').append(f)}document.querySelectorAll('iframe').forEach(x=>x.classList.toggle('active',x===f));document.querySelectorAll('[data-route]').forEach(x=>x.classList.toggle('active',x.dataset.route===id));if(location.hash!=='#'+id)history[push?'pushState':'replaceState'](null,'','#'+id)}
function add(id,name,target){const b=document.createElement('button');b.textContent=id+' '+name;b.dataset.route=id;b.onclick=()=>go(id,true);document.getElementById(target).append(b)}
names.forEach((x,i)=>add(String(i+1),x,'links'));Object.entries(secondary).forEach(([id,x])=>add(id,x,'secondary-links'));
window.addEventListener('message',e=>{if(e.origin!==location.origin||![...document.querySelectorAll('iframe')].some(f=>f.contentWindow===e.source))return;if(e.data.educationPlusRoute)go(e.data.educationPlusRoute,true);if(e.data.educationPlusBack){if(history.length>1)history.back();else go(e.data.fallback||1)}});
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));window.addEventListener('popstate',()=>go(location.hash.slice(1)));go(location.hash.slice(1)||1);
</script><style>aside{max-height:calc(100vh - 72px);overflow:auto}summary{cursor:pointer;padding:12px 0}#secondary-links{display:grid;gap:6px}#secondary-links button{padding:9px;border:1px solid #d4e4dc;border-radius:8px;text-align:left;background:white;color:#18564e;cursor:pointer}#secondary-links button.active{background:#087f73;color:white}</style></html>
