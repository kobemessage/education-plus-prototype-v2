<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>K03 科学追问官提问</title><link rel="stylesheet" href="../science.css"></head><body><header class="science-header"><button class="back" onclick="scienceGo(7)">‹</button><div class="title"><h1>我要问科学家</h1><p>科学追问官 · 实名提问</p></div><span class="dots">•••</span></header><main class="science-page"><section class="hero"><span class="eyebrow">科学追问官</span><h2>好问题，是探索的开始</h2><p>学生提交真实问题，平台审核整理并在线下对接相关领域科学家，答案以文字为主公开刊发。</p></section><form class="card section" onsubmit="submitQuestion(event)"><div class="field"><label>问题分类 <span class="required">*</span></label><select required><option>天文与空间</option><option>地质与自然</option><option>生命与生态</option><option>工程与技术</option><option>其他</option></select></div><div class="field"><label>我的问题 <span class="required">*</span></label><textarea required placeholder="请尽量清楚地描述一个具体问题"></textarea><div class="form-note">建议先写观察到的现象，再说明你最想知道什么。</div></div><div class="field"><label>补充说明或图片</label><div class="upload" onclick="scienceToast('已添加补充图片（演示）')"><b>＋</b>添加图片（选填）</div></div><div class="field"><label>学生真实姓名 <span class="required">*</span></label><input id="studentName" required value="陈小星" placeholder="用于审核与联系"></div><div class="field"><label>学校全称 <span class="required">*</span></label><input id="school" required value="平塘县第三小学" placeholder="请输入所在学校"></div><div class="notice">【演示数据】姓名与学校将在后台完整保存。公开页面暂按“学校＋姓名缩写”脱敏展示，最终公开规则待确认。</div><label class="form-note section"><input type="checkbox" required> 我确认问题由本人提出，并同意平台审核、编辑和公开答复。</label><button class="btn btn-primary btn-block section" type="submit">提交问题</button></form></main><script src="../science.js"></script><script>window.EP_PAGE='K03'</script></body></html>
