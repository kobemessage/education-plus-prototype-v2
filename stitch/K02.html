<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>K02 寻宝家作品提交</title><link rel="stylesheet" href="../science.css"></head><body><header class="science-header"><button class="back" onclick="scienceGo(7)">‹</button><div class="title"><h1>提交科学宝藏</h1><p>我是寻宝家 · 图文视频作品</p></div><span class="dots">•••</span></header><main class="science-page"><div class="notice">【演示数据】请提交学生探访家乡科学宝藏形成的原创内容。视频支持直接上传，也支持填写已发布的视频平台链接。</div><form class="card section" onsubmit="submitTreasure(event)"><div class="field"><label>作品标题 <span class="required">*</span></label><input required placeholder="例如：探访家乡的喀斯特密码"></div><div class="field"><label>科学宝藏地点 <span class="required">*</span></label><input required placeholder="填写城市、区县和具体地点"></div><div class="field"><label>图文内容 <span class="required">*</span></label><textarea required placeholder="写下探访过程、观察发现和科学知识"></textarea></div><div class="field"><label>上传图片</label><div class="upload" onclick="scienceToast('已选择3张图片（演示）')"><b>＋</b>添加现场照片<br><span class="form-note">最多9张，原型不真实上传</span></div></div><div class="field"><label>视频提交方式</label><input id="videoMode" type="hidden" value="upload"><div class="seg"><button type="button" class="active" onclick="chooseVideoMode(this,'upload')">直接上传</button><button type="button" onclick="chooseVideoMode(this,'link')">平台链接</button></div></div><div class="field" id="videoUploadGroup"><div class="upload" onclick="scienceToast('已选择视频（演示）')"><b>▶</b>选择视频文件<br><span class="form-note">建议5分钟以内，原型不真实上传</span></div></div><div class="field" id="videoLinkGroup" hidden><label>视频平台链接</label><input type="url" placeholder="粘贴视频号、抖音、B站等公开链接"></div><div class="field"><label>学生姓名 <span class="required">*</span></label><input required value="王小禾" placeholder="请输入真实姓名"></div><div class="field"><label>学校 <span class="required">*</span></label><input required value="贵阳市实验小学" placeholder="请输入学校全称"></div><label class="form-note"><input type="checkbox" required> 我确认内容真实原创，并同意平台审核后刊发。</label><button class="btn btn-primary btn-block section" type="submit">提交审核</button></form></main><script src="../science.js"></script><script>window.EP_PAGE='K02'</script></body></html>
