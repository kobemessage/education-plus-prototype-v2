<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>电子发票申请</title><link rel="stylesheet" href="../subscription.css"></head><body><script>window.EP_PAGE='N04'</script><header class="topbar"><button onclick="subGo('9')">‹</button><div class="heading"><h1>教育Plus · 电子发票申请</h1><p>核对单位、税号及接收方式</p></div><button class="more">•••</button></header><main class="page"><div class="notice"><b>发票与支付关系</b><br><span data-only-method="C">当前选择“先申请开票后支付”，发票开具后请线下公对公转账。</span><span data-only-method="AB">已支付订单可申请电子发票，请确保开票信息准确。</span></div><form class="card" onsubmit="submitInvoice(event)"><h3>开票信息</h3><div class="form-group"><label>单位名称 <span class="required">*</span></label><input id="organizationName" name="organization" list="organizationExamples" required oninput="matchTaxId()" placeholder="请输入完整单位名称"><datalist id="organizationExamples"><option value="贵阳市第一实验中学"><option value="贵州师范大学附属中学"><option value="贵州省实验中学"></datalist><div class="match warn" id="taxMatchHint">输入完整单位名称后自动匹配</div></div><div class="form-group"><label>纳税人识别号 <span class="required">*</span></label><input id="taxId" name="taxId" required placeholder="自动匹配或手动填写"><p class="meta">原型仅使用演示匹配数据；正式上线需接入合规单位信息服务，并由用户核对确认。</p></div><div class="form-group"><label>发票内容</label><input value="报刊订阅费" readonly></div><div class="form-group"><label>接收发票邮箱 <span class="required">*</span></label><input id="invoiceEmail" name="invoiceEmail" type="email" required></div><div class="form-group"><label>接收发票手机 <span class="required">*</span></label><input id="invoicePhone" name="invoicePhone" type="tel" pattern="1[0-9]{10}" required><p class="meta">开票后将通过短信通知，并附电子发票下载链接。</p></div><label class="check"><input type="checkbox" required>我已核对单位名称、税号、邮箱和手机号</label><button class="btn block" style="margin-top:14px">提交发票申请</button></form></main><div class="toast"></div><script src="../subscription.js"></script><script src="../bottom-nav.js"></script></body></html>
